<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="main.css">
    <script src="script.ts" defer></script>
</head>

<body>

    <header>

        <div></div>
        <h1 id="title">RPlayG</h1>
        <div>
            <p class="username">...</p>
            <a href="#" id="logout" onclick="out()">Sair</a>
        </div>

    </header>

    <div id="evhelp">
        
        <aside class="play">
        
            <!-- vai ter coisa carregando aqui dawg -->
        
        </aside>

        <main>

            <div id="maincont">
                <p>Clique em uma playlist!</p>
            </div>

            <div id="buttons">
                <button id="ante">Before</button>
                <button id="pausebtn">Pause/Play</button>
                <button id="next">Next</button>
            </div>
            
        </main>

        <aside class="info">

            <p>Quer saber por que a música está na playlist? Coloque ela pra tocar!</p>

        </aside>

    </div>

    <script>

        async function init() {
            const response = await fetch("/login/user")
            if (!response.ok) {
                alert("Usuário não logado")
                window.location.href = "/"
                return
            }
            const data = await response.json()
            document.querySelector(".username").textContent = data.username
        }
        init()

        function out() {
            window.cookieStore.delete("ses")
            window.location.href = "/"
        }

    </script>

</body>

</html>
