<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Cadastro</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="cadastro.css">

</head>

<body>

    <header>

        <div></div>
        <h1 id="title">RPlayG</h1>

    </header>

    <div class="oquefornecessarioprafuncionarolayout">

        <div class="opcoes">

            <h2>Entrar</h2>

            <form id="login">

                <input type="text" name="username" placeholder="Usuário">
                <input type="text" name="password" placeholder="Senha">
                <button>Entrar</button>

            </form>

        </div>

        <div class="opcoes">

            <h2>Cadastrar</h2>

            <form id="cadastro">

                <input type="text" name="username" placeholder="Usuário">
                <input type="text" name="password" placeholder="Senha">
                <button>Cadastrar-se</button>

            </form>


        </div>

    </div>


    <script>

        // login
        const frmLogin = document.querySelector('#login')
        const frmCadastro = document.querySelector('#cadastro')

        frmLogin.addEventListener("submit", async (ev) => {

            ev.preventDefault()
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "password": frmLogin.password.value
                })
            })

            if (response.status == 400) {
                return alert("Vazio... Você deveria fazer algo sobre isso.")
            }

            if (response.status == 404) {
                alert("Usuário não existente")
                return
            }
            if (response.status == 401) {
                alert("Senha Incorreta")
                return
            }

            if (response.ok) {
                window.location.href = "/home"
                return
            }

            alert("You shouldn't have done that. (Algo deu errado)")

        })

        // cadastro
        frmCadastro.addEventListener("submit", async (ev) => {

            ev.preventDefault()
            const response = await fetch("/user", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmCadastro.username.value,
                    "password": frmCadastro.password.value
                })
            })


            if (response.ok) {
                cadastro.reset()
                return alert('Usuário Cadastrado!')
            }

            alert("How did we get here? (Algo deu errado)")

        })

    </script>

</body>

</html>
